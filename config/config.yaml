# Configuración central del proyecto (dueña: Producción). Equipo 6.
# Los notebooks reciben estos valores como widgets/parámetros del Job; la API los lee al iniciar.
# Lo marcado "(confirmar)" se cambia SOLO aquí.

equipo:
  numero: 6
  prefijo_s3: equipo6               # carpeta del equipo dentro de cada bucket

databricks:
  catalogo: workspace
  esquemas:                         # (confirmar nombres con el catedrático)
    bronze: equipo6_bronze
    silver: equipo6_silver
    gold: equipo6_gold
  job: equipo6-pipeline

# Workspace propio (13 nov): tablas gestionadas y archivos en este Volume.
volumen_crudos: /Volumes/workspace/equipo6_bronze/crudos   # fotos/, complementarias/{mem,fred}/

# Buckets del curso (alternativa: pasar estas rutas a los widgets ruta_* para tablas externas)
s3:
  fotos: s3://cc3105-raw-869227452861-us-east-2-an/img/          # xloc-raw (solo lectura)
  bronze: s3://cc3105-cusn-869227452861-us-east-2-an/equipo6     # xloc-cusn
  silver: s3://cc3105-ag-869227452861-us-east-2-an/equipo6       # xloc-ag
  gold: s3://cc3105-au-869227452861-us-east-2-an/equipo6         # xloc-au
  region: us-east-2

tablas:
  bronze: [fotos_precios]
  silver: [precios, precios_rejected]
  gold: [precio_semanal, variacion_semanal, features_modelo, predicciones, metricas_modelo]

combustibles: [super, regular, diesel]
modalidades: [autoservicio, servicio_completo, no_indica]

calidad:
  rango_precio: {min: 20.0, max: 60.0}     # Q/galón
  confianza_minima: 0.5
  formatos_foto: [.heic, .heif, .jpg, .jpeg, .png]

semana:
  inicio: martes                           # semanas martes-lunes, igual que el MEM

direccion:
  umbral_q: 0.10                           # |dif_q| <= umbral -> se_mantiene
  clases: [sube, baja, se_mantiene]

extraccion:
  motor: rapidocr
  preproc: gris_clahe

api:
  puerto: 8006                             # 80XX del equipo (confirmar)
  limit_default: 100
  limit_max: 1000
  oro_ttl_segundos: 300                    # cada cuánto se vuelven a leer las tablas Oro
  zona_horaria_utc: -6                     # Guatemala
